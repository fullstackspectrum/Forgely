<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102 102" width="102" height="102" role="img" aria-label="Loading">
  <title>Forgely</title>
  <style>
    .c,.o,.k{transform-box:fill-box;transform-origin:center}
    .k{transform:rotate(12deg);animation:fg-core 1.8s ease-in-out infinite}
    .o{animation-duration:1.8s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-delay:.1s}
    .c{animation-duration:1.8s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-delay:.22s}
    .o-t{animation-name:fg-up}.o-b{animation-name:fg-down}
    .o-l{animation-name:fg-left}.o-r{animation-name:fg-right}
    .c-tl{animation-name:fg-tl}.c-tr{animation-name:fg-tr}
    .c-bl{animation-name:fg-bl}.c-br{animation-name:fg-br}
    @keyframes fg-core{0%,100%{transform:rotate(12deg) scale(1)}10%{transform:rotate(19deg) scale(1.14)}32%{transform:rotate(12deg) scale(1)}}
    @keyframes fg-up{0%,100%{transform:translateY(0)}20%{transform:translateY(-5px)}46%{transform:translateY(0)}}
    @keyframes fg-down{0%,100%{transform:translateY(0)}20%{transform:translateY(5px)}46%{transform:translateY(0)}}
    @keyframes fg-left{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}46%{transform:translateX(0)}}
    @keyframes fg-right{0%,100%{transform:translateX(0)}20%{transform:translateX(5px)}46%{transform:translateX(0)}}
    @keyframes fg-tl{0%,100%{transform:translate(0,0);opacity:0.35}20%{transform:translate(-3.5px,-3.5px);opacity:0.8}46%{transform:translate(0,0);opacity:0.35}}
    @keyframes fg-tr{0%,100%{transform:translate(0,0);opacity:0.35}20%{transform:translate(3.5px,-3.5px);opacity:0.8}46%{transform:translate(0,0);opacity:0.35}}
    @keyframes fg-bl{0%,100%{transform:translate(0,0);opacity:0.35}20%{transform:translate(-3.5px,3.5px);opacity:0.8}46%{transform:translate(0,0);opacity:0.35}}
    @keyframes fg-br{0%,100%{transform:translate(0,0);opacity:0.35}20%{transform:translate(3.5px,3.5px);opacity:0.8}46%{transform:translate(0,0);opacity:0.35}}
    @media (prefers-reduced-motion: reduce){.c,.o,.k{animation:none}.c{opacity:0.8}}
  </style>
  <rect class="c c-tl" x="2" y="2" width="26" height="26" rx="6" fill="currentColor" opacity="0.35"/>
  <rect class="c c-tr" x="74" y="2" width="26" height="26" rx="6" fill="currentColor" opacity="0.35"/>
  <rect class="c c-bl" x="2" y="74" width="26" height="26" rx="6" fill="currentColor" opacity="0.35"/>
  <rect class="c c-br" x="74" y="74" width="26" height="26" rx="6" fill="currentColor" opacity="0.35"/>
  <rect class="o o-t" x="38" y="0" width="26" height="26" rx="6" fill="currentColor"/>
  <rect class="o o-l" x="0" y="38" width="26" height="26" rx="6" fill="currentColor"/>
  <rect class="o o-r" x="76" y="38" width="26" height="26" rx="6" fill="currentColor"/>
  <rect class="o o-b" x="38" y="76" width="26" height="26" rx="6" fill="currentColor"/>
  <rect class="k" x="36.5" y="36.5" width="29" height="29" rx="7" fill="currentColor"/>
</svg>
